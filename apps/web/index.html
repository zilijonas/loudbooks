<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF4EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loud Books" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <script>
      // iOS snapshots the apple-touch-icon when the page is added to the Home Screen and has no
      // per-appearance markup, so pick the dark variant (black, cream book, orange arcs) while the system is dark.
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        var l = document.querySelector('link[rel=apple-touch-icon]')
        l.href = l.href.replace('apple-touch-icon-180', 'apple-touch-icon-dark-180')
      }
    </script>
    <title>Loud Books</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
